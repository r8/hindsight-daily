[project]
name = "hindsight-daily"
version = "0.1.0"
description = "Syncs Obsidian daily notes to Hindsight so they can be recalled by AI agents."
readme = "README.md"
authors = [
    { name = "Sergey Storchay", email = "r8@r8.com.ua" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.3",
    "loguru>=0.7.0",
    "confuse>=2.2.0",
    "diskcache>=5.6.3",
    "hindsight-client>=0.5.4",
    "platformdirs>=4.9.6",
    "python-frontmatter>=1.1.0",
    "markdown-it-py>=3.0.0",
]

[project.scripts]
hindsight-daily = "hindsight_daily.cli:cli"

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=8.0",
    "ruff>=0.15.12",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
